[phases.setup]
nixPkgs = [
    "libGL",
    "glib",
    "libglib",
    "libxkbcommon"
]

[phases.build]
cmds = [
    "python -c \"import cv2; print('OpenCV:', cv2.__version__)\"",
    "python -c \"import ctypes.util; print('libGL:', ctypes.util.find_library('GL'))\"",
    "pip check"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"